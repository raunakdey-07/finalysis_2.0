# HOW TO CREATE THIS SECRET
#
# This file is a template with empty values, and it is safe to commit because
# it contains no secret. Do not commit the file you actually apply.
#
# The point of showing it is that both values are OPTIONAL, and that matters
# more than it looks:
#
#   CRON_SECRET   Bearer token the scheduled price-snapshot job requires. If it
#                 is absent the job returns 503 and does not run. It is never
#                 optional in the sense of "runs open": there is no code path
#                 where a missing secret means no authentication.
#   KV_REDIS_URL  Redis connection string for the end-of-day close snapshot.
#                 Without it the snapshot is unavailable and prices fall back to
#                 a cache-only policy. The site still works.
#
# For a local demonstration both can be left unset, which is why the Deployment
# marks both secretKeyRefs optional.
#
#   kubectl -n finalysis create secret generic finalysis-secrets \
#     --from-literal=CRON_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=KV_REDIS_URL="redis://user:password@host:6379"
#
# For the version in this repository, which is committed on purpose because the
# values are empty:
apiVersion: v1
kind: Secret
metadata:
  name: finalysis-secrets
  namespace: finalysis
  labels:
    app.kubernetes.io/name: finalysis
type: Opaque
stringData:
  CRON_SECRET: ""
  KV_REDIS_URL: ""