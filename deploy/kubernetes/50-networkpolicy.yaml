# Default-deny ingress, then allow exactly what the pods need.
#
# Both Fin-alysis pods need to reach three external providers, so egress cannot
# be fully closed. This policy therefore restricts ingress, where it can be
# exact, and documents the egress that has to stay open rather than pretending
# it can be locked down.
#
# Ingress: Prometheus scrapes /api/telemetry on 9090 by pod IP. Everything else
# in the namespace is denied.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: finalysis-default-deny-ingress
  namespace: finalysis
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: finalysis
  policyTypes:
    - Ingress
  ingress: []
---
# The default-deny above is real, and it blocked something it should not have.
#
# Prometheus scrapes /api/telemetry on port 3000 from inside the cluster. The
# first version of this file denied every ingress to a Fin-alysis pod and never
# re-opened it, so the scrape could never connect: the target resolved by DNS
# and reported up=0. The application was fine, and `kubectl port-forward` still
# worked, which is exactly why nothing noticed: a port-forward tunnels through
# the API server and is not subject to NetworkPolicy at all.
#
# So ingress on the metrics path is opened again, narrowly, to pods that are
# labelled as a scraper or that live in the monitoring namespace. Nothing else
# is allowed in, and the page itself stays unreachable from another pod.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: finalysis-allow-metrics-scrape
  namespace: finalysis
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: finalysis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: prometheus
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 3000
---
# Egress, written out explicitly rather than left to "allow all", so the three
# things this application actually talks to are visible in the repository.
#
#   0.0.0.0/0 on 443/80   the three public providers. They cannot be expressed
#                         as a narrower rule: they are third-party HTTPS
#                         endpoints with no in-cluster counterpart, and this
#                         application has no database or internal service to
#                         reach. DNS is allowed separately below.
#   kube-system:53        resolving provider hostnames.
#   monitoring namespace  Prometheus scraping /api/telemetry.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: finalysis-allow-egress
  namespace: finalysis
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: finalysis
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9090
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80