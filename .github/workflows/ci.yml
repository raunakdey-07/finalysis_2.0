name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        # No `version` here on purpose. pnpm/action-setup reads the exact
        # version from the `packageManager` field in package.json, and setting
        # both makes the action fail with ERR_PNPM_BAD_PM_VERSION.
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate symbols index
        run: pnpm run stocks:validate

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

      - name: Build
        env:
          NEXT_PUBLIC_SITE_URL: https://finalysis.vercel.app
        run: pnpm run build
